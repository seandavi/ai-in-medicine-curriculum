# Slide decks, one per chapter, rendered as a separate Quarto project.
#
# The book project (../_quarto.yml) cannot output revealjs, so the decks live in
# their own project. Render the book first, because a full book render clears
# _book/:
#
#   quarto render            # the book, from the repository root
#   quarto render slides     # the decks, then publish.py copies them to _book/slides/
#
# Images come from ../images/, which the book copies into _book/images/.
# Figures drawn for the decks are generated by make_figures.py.
project:
  type: default
  output-dir: _output
  # Only the decks. The generated *-narration.md scripts are not rendered.
  render:
    - "*.qmd"
  post-render: publish.py

bibliography:
  - ../references.bib
  - ../references.resolved.bib
csl: ../apa.csl
link-citations: true

format:
  revealjs:
    # The Tuesday history deck's settings (talks/2026-10-13-idpt-ai-history):
    # a 1600 x 900 slide, content from the top, no automatic stretching.
    theme: [default, theme.scss]
    css: ../styles.css
    width: 1600
    height: 900
    margin: 0.05
    min-scale: 0.2
    max-scale: 2.0
    center: false
    auto-stretch: false
    slide-number: c/t
    show-slide-number: all
    progress: true
    hash: true
    hash-type: number
    history: true
    controls: false
    transition: fade
    transition-speed: fast
    background-transition: fade
    menu:
      side: left
      numbers: true
    preview-links: false
    link-external-newwindow: true
    link-external-icon: false
    echo: false
