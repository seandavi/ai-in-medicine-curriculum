# Slide decks, one per chapter, rendered as a separate Quarto project.
#
# The book project (../_quarto.yml) cannot output revealjs, so the decks live in
# their own project. Render the book first, because a full book render clears
# _book/:
#
#   quarto render            # the book, from the repository root
#   quarto render slides     # the decks, then publish.py copies them to _book/slides/
#
# Images come from ../images/, which the book copies into _book/images/.
# Figures drawn for the decks are generated by make_figures.py.
project:
  type: default
  output-dir: _output
  # Only the decks. The generated *-narration.md scripts are not rendered.
  render:
    - "*.qmd"
  post-render: publish.py

bibliography:
  - ../references.bib
  - ../references.resolved.bib
csl: ../apa.csl
link-citations: true

format:
  revealjs:
    theme: [dark, theme.scss]
    css: ../styles.css
    slide-number: c/t
    hash-type: number
    transition: fade
    transition-speed: fast
    link-external-newwindow: true
    echo: false
