name: claude-review

# Reviews every pull request against the standard in CLAUDE.md (plain language,
# verified citations, the six personas) and posts inline comments.
#
# Needs: the Claude GitHub App installed on the repo (https://github.com/apps/claude)
# and one secret. `/install-github-app` in a Claude Code session does both.
# CLAUDE_CODE_OAUTH_TOKEN bills a Claude subscription (`claude setup-token`);
# swap the `with:` line for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
# to bill an API key instead. Secrets are withheld from fork PRs; those get a
# review only when someone with write access comments `@claude review`.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**.qmd"
      - "**.md"
      - "_quarto.yml"
      - "styles.css"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. Read CLAUDE.md first, then the two files it
            names (curriculum/chapter-pattern.md, curriculum/personas.md), then the
            diff (`gh pr diff ${{ github.event.pull_request.number }}`).

            Apply the "Reviewing a pull request" section of CLAUDE.md. Post
            findings as inline comments on the changed lines, most serious first,
            each with the smallest edit that fixes it. Then post one short summary
            comment: one line on what is good, the count of findings by kind, and
            any citation key you could not check. Do not edit files. Do not
            approve or request changes; a person decides that.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
