<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Lost in the middle: accuracy by position of the answer</title>
<desc>Line chart. GPT-3.5-Turbo answered questions from 20 documents, one of which held the answer. Accuracy was 75.8% with the answer first, 57.2% at position 5, 53.8% at position 10, 55.4% at position 15, and 63.2% last. A dashed line at 56.1% shows the same model with no documents. In the middle positions the model did about as well as, or worse than, having no documents.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="1100" height="600" rx="14" fill="#ffffff"/>
<text x="40" y="44" font-size="25" fill="#1f2933" text-anchor="start" font-weight="bold">Accuracy depends on where the answer sits among 20 documents</text>
<line x1="110" y1="460.0" x2="1040" y2="460.0" stroke="#d9dee5" stroke-width="1.5"/>
<text x="96" y="468.0" font-size="22" fill="#5f6b7a" text-anchor="end" font-weight="normal">50%</text>
<line x1="110" y1="333.3" x2="1040" y2="333.3" stroke="#d9dee5" stroke-width="1.5"/>
<text x="96" y="341.33333333333337" font-size="22" fill="#5f6b7a" text-anchor="end" font-weight="normal">60%</text>
<line x1="110" y1="206.7" x2="1040" y2="206.7" stroke="#d9dee5" stroke-width="1.5"/>
<text x="96" y="214.66666666666669" font-size="22" fill="#5f6b7a" text-anchor="end" font-weight="normal">70%</text>
<line x1="110" y1="80.0" x2="1040" y2="80.0" stroke="#d9dee5" stroke-width="1.5"/>
<text x="96" y="88.0" font-size="22" fill="#5f6b7a" text-anchor="end" font-weight="normal">80%</text>
<text x="110.0" y="492" font-size="22" fill="#5f6b7a" text-anchor="middle" font-weight="normal">1</text>
<text x="305.7894736842105" y="492" font-size="22" fill="#5f6b7a" text-anchor="middle" font-weight="normal">5</text>
<text x="550.5263157894736" y="492" font-size="22" fill="#5f6b7a" text-anchor="middle" font-weight="normal">10</text>
<text x="795.2631578947368" y="492" font-size="22" fill="#5f6b7a" text-anchor="middle" font-weight="normal">15</text>
<text x="1040.0" y="492" font-size="22" fill="#5f6b7a" text-anchor="middle" font-weight="normal">20</text>
<text x="575.0" y="526" font-size="21" fill="#5f6b7a" text-anchor="middle" font-weight="normal">Position of the document that holds the answer (1 = first, 20 = last)</text>
<line x1="110" y1="382.7" x2="1040" y2="382.7" stroke="#c45a00" stroke-width="3" stroke-dasharray="10 8"/>
<polyline points="110.0,133.2 305.8,368.8 550.5,411.9 795.3,391.6 1040.0,292.8" fill="none" stroke="#1f5fa8" stroke-width="5"/>
<circle cx="110.0" cy="133.2" r="9" fill="#1f5fa8"/>
<text x="110.0" y="113.20000000000005" font-size="22" fill="#1f5fa8" text-anchor="middle" font-weight="bold">75.8%</text>
<circle cx="305.8" cy="368.8" r="9" fill="#1f5fa8"/>
<text x="305.7894736842105" y="404.79999999999995" font-size="22" fill="#1f5fa8" text-anchor="middle" font-weight="bold">57.2%</text>
<circle cx="550.5" cy="411.9" r="9" fill="#1f5fa8"/>
<text x="550.5263157894736" y="447.8666666666667" font-size="22" fill="#1f5fa8" text-anchor="middle" font-weight="bold">53.8%</text>
<circle cx="795.3" cy="391.6" r="9" fill="#1f5fa8"/>
<text x="795.2631578947368" y="427.6" font-size="22" fill="#1f5fa8" text-anchor="middle" font-weight="bold">55.4%</text>
<circle cx="1040.0" cy="292.8" r="9" fill="#1f5fa8"/>
<text x="1040.0" y="272.79999999999995" font-size="22" fill="#1f5fa8" text-anchor="middle" font-weight="bold">63.2%</text>
<line x1="40" y1="571" x2="90" y2="571" stroke="#1f5fa8" stroke-width="5"/>
<text x="102" y="578" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal">GPT-3.5-Turbo, given 20 documents</text>
<line x1="480" y1="571" x2="530" y2="571" stroke="#c45a00" stroke-width="3" stroke-dasharray="10 8"/>
<text x="542" y="578" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal">same model, given no documents (56.1%)</text>
</svg>
