<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Redrawn from published numbers: Sjoding 2020 (NEJM), Valbuena 2022 (BMJ), Fawzy 2022 (JAMA Intern Med). Data are not copyrightable. -->
  <rect width="900" height="400" fill="#fff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold">Occult hypoxemia: arterial saturation below 88% while the pulse oximeter read normal</text>
  <!-- axes -->
  <line x1="70" y1="330" x2="880" y2="330" stroke="#333"/>
  <line x1="70" y1="330" x2="70" y2="60" stroke="#333"/>
  <g fill="#555" text-anchor="end">
    <text x="62" y="334">0%</text><line x1="66" y1="330" x2="70" y2="330" stroke="#333"/>
    <text x="62" y="266">10%</text><line x1="66" y1="262" x2="880" y2="262" stroke="#ddd"/>
    <text x="62" y="198">20%</text><line x1="66" y1="194" x2="880" y2="194" stroke="#ddd"/>
    <text x="62" y="130">30%</text><line x1="66" y1="126" x2="880" y2="126" stroke="#ddd"/>
  </g>
  <!-- scale: 6.8 px per percent; y = 330 - 6.8*v -->
  <!-- Cohort 1: Sjoding, Michigan 2020 -->
  <g>
    <rect x="100" y="305.5" width="34" height="24.5" fill="#9ecae1"/><text x="117" y="300" text-anchor="middle">3.6</text>
    <rect x="138" y="250.4" width="34" height="79.6" fill="#08519c"/><text x="155" y="245" text-anchor="middle">11.7</text>
    <text x="136" y="350" text-anchor="middle" font-weight="bold">Michigan, 2020</text>
    <text x="136" y="366" text-anchor="middle" fill="#555">Sjoding et al.</text>
  </g>
  <!-- Cohort 2: Sjoding, 178 hospitals 2014-15 -->
  <g>
    <rect x="270" y="287.8" width="34" height="42.2" fill="#9ecae1"/><text x="287" y="282" text-anchor="middle">6.2</text>
    <rect x="308" y="214.4" width="34" height="115.6" fill="#08519c"/><text x="325" y="209" text-anchor="middle">17.0</text>
    <text x="306" y="350" text-anchor="middle" font-weight="bold">178 hospitals, 2014–15</text>
    <text x="306" y="366" text-anchor="middle" fill="#555">Sjoding et al.</text>
  </g>
  <!-- Cohort 3: Valbuena, VA 2013-19 (SpO2 >= 92) -->
  <g>
    <rect x="440" y="223.9" width="34" height="106.1" fill="#9ecae1"/><text x="457" y="218" text-anchor="middle">15.6</text>
    <rect x="478" y="196.7" width="34" height="133.3" fill="#08519c"/><text x="495" y="191" text-anchor="middle">19.6</text>
    <rect x="516" y="219.8" width="34" height="110.2" fill="#fd8d3c"/><text x="533" y="214" text-anchor="middle">16.2</text>
    <text x="495" y="350" text-anchor="middle" font-weight="bold">VA general care, 2013–19*</text>
    <text x="495" y="366" text-anchor="middle" fill="#555">Valbuena et al.</text>
  </g>
  <!-- Cohort 4: Fawzy, Johns Hopkins COVID -->
  <g>
    <rect x="650" y="213.0" width="34" height="117.0" fill="#9ecae1"/><text x="667" y="207" text-anchor="middle">17.2</text>
    <rect x="688" y="136.2" width="34" height="193.8" fill="#08519c"/><text x="705" y="131" text-anchor="middle">28.5</text>
    <rect x="726" y="127.4" width="34" height="202.6" fill="#fd8d3c"/><text x="743" y="122" text-anchor="middle">29.8</text>
    <rect x="764" y="124.6" width="34" height="205.4" fill="#74c476"/><text x="781" y="119" text-anchor="middle">30.2</text>
    <text x="724" y="350" text-anchor="middle" font-weight="bold">Johns Hopkins, COVID-19</text>
    <text x="724" y="366" text-anchor="middle" fill="#555">Fawzy et al.</text>
  </g>
  <!-- legend -->
  <g transform="translate(90,50)">
    <rect x="0" y="0" width="14" height="14" fill="#9ecae1"/><text x="20" y="12">White</text>
    <rect x="80" y="0" width="14" height="14" fill="#08519c"/><text x="100" y="12">Black</text>
    <rect x="160" y="0" width="14" height="14" fill="#fd8d3c"/><text x="180" y="12">Hispanic</text>
    <rect x="250" y="0" width="14" height="14" fill="#74c476"/><text x="270" y="12">Asian</text>
  </g>
  <text x="880" y="390" text-anchor="end" fill="#555" font-size="11">*Valbuena counts any oximeter reading ≥92%; the others use 92–96%. Compare bars within a cohort, not across.</text>
</svg>
