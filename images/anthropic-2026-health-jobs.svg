<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 604" width="810" height="604" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
<title>Observed exposure for selected health occupations, Anthropic data released March 2026</title>
<!-- Data: Anthropic Economic Index, labor_market_impacts/job_exposure.csv (Massenkoff and McCrory 2026), CC BY. Drawing by the course. -->
<rect width="810" height="604" fill="#ffffff"/>
